name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: khp, POSTGRES_PASSWORD: khp, POSTGRES_DB: khp }
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://khp:khp@localhost:5432/khp
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      OTP_PEPPER: ci-only-otp-pepper-0123456789abcdef0123456789
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run build
      # The postgis/postgis image pre-installs PostGIS in the public schema, so the migration's
      # "CREATE EXTENSION IF NOT EXISTS postgis WITH SCHEMA extensions" is skipped and
      # extensions.geography is missing. Remove the image's copy so the migration installs it
      # where Supabase has it (the extensions schema).
      - name: Match Supabase extension layout
        run: psql "$DATABASE_URL" -c "DROP EXTENSION IF EXISTS postgis_tiger_geocoder, postgis_topology, fuzzystrmatch, postgis CASCADE;"
      - run: npm run migrate
      # Same as "npm test", but the file list is expanded by the shell: Node 20 (the version the
      # API runs on in production) does not expand "src/**/*.test.ts" itself.
      - name: Run tests (includes DB and HTTP integration tests)
        run: npx tsx --test $(find src -name '*.test.ts' | sort)
      - run: npm audit --audit-level=high
